[project]
name = "planner"
version = "0.1.0"
description = "A full-stack Jac application"
jac-version = "==0.37.14"
default-app = "planner"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[client]

[apps.planner]
kind = "web-app"
entry-point = "main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"
